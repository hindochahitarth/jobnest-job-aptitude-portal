spring.application.name=jobnest-job-aptitude-portal
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:jobnest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.locations=classpath:db/migration
app.jwt.secret=${APP_JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:86400}
